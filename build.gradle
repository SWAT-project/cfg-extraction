plugins {
    id 'java'
    id 'groovy'
    id 'application'
    id 'maven-publish'
}

group = 'de.uzl.its'
version = '1.0-SNAPSHOT'

// SootUp 3.x is compiled for Java 17 (class file major version 61)
sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    google()  // For Android tools
}

dependencies {
    // SootUp dependencies
    // Note: two artifacts were renamed in SootUp 2.0.0:
    //   sootup.java.bytecode -> sootup.java.bytecode.frontend
    //   sootup.analysis      -> sootup.analysis.interprocedural
    implementation 'org.soot-oss:sootup.core:3.0.1'
    implementation 'org.soot-oss:sootup.java.core:3.0.1'
    implementation 'org.soot-oss:sootup.java.bytecode.frontend:3.0.1'
    implementation 'org.soot-oss:sootup.callgraph:3.0.1'
    implementation 'org.soot-oss:sootup.analysis.interprocedural:3.0.1'

    // JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // The property pre-check (staticcheck) reads class files with ASM. SootUp brings the same
    // version; it is named here because precheckJar bundles it.
    implementation 'org.ow2.asm:asm:9.10.1'
    implementation 'org.ow2.asm:asm-tree:9.10.1'
    implementation 'org.ow2.asm:asm-analysis:9.10.1'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.spockframework:spock-core:2.5-groovy-4.0'
}

test {
    useJUnitPlatform()
}

// Recorded as Implementation-Version in the jars; the pre-check reports it as "version".
def gitVersion = {
    try {
        def proc = ['git', 'describe', '--tags', '--always', '--dirty'].execute(null, projectDir)
        proc.waitFor()
        def v = proc.text.trim()
        return proc.exitValue() == 0 && v ? v : project.version.toString()
    } catch (Exception ignored) {
        return project.version.toString()
    }
}

application {
    mainClass = 'de.uzl.its.cfg.Main'
}

// Task to run analysis on target directory
task runAnalysis(type: JavaExec) {
    group = 'application'
    description = 'Run CFG extraction on target directory'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.uzl.its.cfg.Main'
    args = ['target/', 'output/']
    enableAssertions = true
}

// Self-contained executable jar (bundles all runtime dependencies)
task fatJar(type: Jar) {
    group = 'build'
    description = 'Build an executable jar with all dependencies bundled'
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': application.mainClass, 'Implementation-Version': gitVersion()
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Dependency jars overlap on these; keeping any one copy breaks jar signature
    // verification and the JPMS descriptors are meaningless on the classpath.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

build.dependsOn fatJar

// The property pre-check alone: its classes and ASM, without SootUp, for the SV-COMP archive
// (SWAT runs it as java -cp <jar> de.uzl.its.cfg.staticcheck.ExceptionFreedomCheck <classpath>).
// META-INF/swat-third-party.json lists the bundled components for SWAT's license file.
def precheckComponents = layout.buildDirectory.dir('generated/precheck-third-party')
task precheckComponentList {
    def classpath = configurations.runtimeClasspath
    inputs.files(classpath)
    outputs.dir(precheckComponents)
    doLast {
        def entries = classpath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.moduleVersion.id.group == 'org.ow2.asm' && it.name in ['asm', 'asm-tree', 'asm-analysis'] }
                .collect { [group: 'org.ow2.asm', name: it.name, version: it.moduleVersion.id.version,
                            licenses: [[name: 'BSD-3-Clause', url: 'https://asm.ow2.io/license.html']],
                            url: 'https://asm.ow2.io/'] }
                .unique { it.name }
                .sort { it.name }
        if (entries.size() != 3) throw new GradleException("expected asm, asm-tree and asm-analysis, found ${entries*.name}")
        def out = precheckComponents.get().file('META-INF/swat-third-party.json').asFile
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries))
    }
}

task precheckJar(type: Jar) {
    group = 'build'
    description = 'Build the property pre-check jar (staticcheck and ASM only)'
    archiveFileName = 'cfg-extractor-precheck.jar'
    manifest {
        attributes 'Main-Class': 'de.uzl.its.cfg.staticcheck.ExceptionFreedomCheck',
                'Implementation-Version': gitVersion()
    }
    from(sourceSets.main.output) { include 'de/uzl/its/cfg/staticcheck/**' }
    from(precheckComponentList)
    from {
        configurations.runtimeClasspath.filter { it.name ==~ /asm(-tree|-analysis)?-[0-9.]+\.jar/ }.collect { zipTree(it) }
    }
    exclude 'module-info.class', 'META-INF/MANIFEST.MF', 'META-INF/versions/**'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

build.dependsOn precheckJar

// Create output directory
task createOutputDir {
    doLast {
        file('output').mkdirs()
    }
}

build.dependsOn createOutputDir

// Publishing configuration for GitHub Packages
publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            groupId = 'de.uzl.its'
            artifactId = 'cfg-extractor'
            version = project.version
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/SWAT-project/cfg-extraction")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
