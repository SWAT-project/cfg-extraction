plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
}

group = 'de.uzl.its'
version = '1.0-SNAPSHOT'

// SootUp 3.x is compiled for Java 17 (class file major version 61)
sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    google()  // For Android tools
}

dependencies {
    // SootUp dependencies
    // Note: two artifacts were renamed in SootUp 2.0.0:
    //   sootup.java.bytecode -> sootup.java.bytecode.frontend
    //   sootup.analysis      -> sootup.analysis.interprocedural
    implementation 'org.soot-oss:sootup.core:3.0.1'
    implementation 'org.soot-oss:sootup.java.core:3.0.1'
    implementation 'org.soot-oss:sootup.java.bytecode.frontend:3.0.1'
    implementation 'org.soot-oss:sootup.callgraph:3.0.1'
    implementation 'org.soot-oss:sootup.analysis.interprocedural:3.0.1'

    // JSON serialization
    implementation 'com.google.code.gson:gson:2.10.1'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'org.slf4j:slf4j-simple:2.0.9'

    // Testing
    testImplementation 'junit:junit:4.13.2'
}

application {
    mainClass = 'de.uzl.its.cfg.Main'
}

// Task to run analysis on target directory
task runAnalysis(type: JavaExec) {
    group = 'application'
    description = 'Run CFG extraction on target directory'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'de.uzl.its.cfg.Main'
    args = ['target/', 'output/']
    enableAssertions = true
}

// Self-contained executable jar (bundles all runtime dependencies)
task fatJar(type: Jar) {
    group = 'build'
    description = 'Build an executable jar with all dependencies bundled'
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': application.mainClass
    }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Dependency jars overlap on these; keeping any one copy breaks jar signature
    // verification and the JPMS descriptors are meaningless on the classpath.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

build.dependsOn fatJar

// Create output directory
task createOutputDir {
    doLast {
        file('output').mkdirs()
    }
}

build.dependsOn createOutputDir

// Publishing configuration for GitHub Packages
publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            groupId = 'de.uzl.its'
            artifactId = 'cfg-extractor'
            version = project.version
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/SWAT-project/cfg-extraction")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.token") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
